
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header>
    <h1>Rock Paper Scissors ✊</h1>
    <p>Choose your move and challenge the computer!</p>
  </header>

  <main>
    <section class="game-card">
      <h2>Make Your Choice</h2>

      <div class="choices">
        <button type="button" id="rock">✊ Rock</button>
        <button type="button" id="paper">✋ Paper</button>
        <button type="button" id="scissors">✌️ Scissors</button>
      </div>

      <div class="choices-display">
        <div class="choice-box">
          <p>Your choice</p>
          <span id="player-choice">❔ Waiting...</span>
        </div>

        <div class="choice-box">
          <p>Computer's choice</p>
          <span id="computer-choice">❔ Waiting...</span>
        </div>
      </div>

      <p id="result">Choose a move to start!</p>

      <div class="scoreboard">
        <p>You: <span id="player-score">0</span></p>
        <p>Computer: <span id="computer-score">0</span></p>
      </div>

      <div class="game-actions">
        <button type="button" id="reset-button">Reset Game</button>
        <button type="button" id="clear-history">Clear History</button>
      </div>

      <section class="history-section">
        <h2>Match History 📜</h2>
        <ul id="history-list">
          <li>Your rounds will appear here.</li>
        </ul>
      </section>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
